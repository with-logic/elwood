name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Hosted macOS can reach the shorter cap before the suite reports its result.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 20 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build, typecheck, lint, line cap, unit and conformance tests
        run: npm run check
      - name: Workflow tests
        run: node --test tests/workflows/*.test.mjs
