# Claude Code PR review + mention responder.
#
# On PR open, posts a review grounded in CLAUDE.md and
# .github/pr-review-prompt.md. On @claude mentions in PR comments, review
# comments, or submitted reviews, lets Claude respond directly.
#
# Both jobs run only for pull requests from branches in this repository and,
# for mentions, only when the commenter is an owner, member, or collaborator.
# Fork pull requests never receive repository secrets, and an unrestricted
# mention trigger would let any account spend API credit and run tools.
#
# Required secret:
#   - ANTHROPIC_API_KEY
name: Claude Code

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review-pr:
    name: "Claude: Review new PR"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Read PR review prompt
        id: read-prompt
        run: |
          {
            echo 'prompt<<EOF'
            cat .github/pr-review-prompt.md
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code - Review PR
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.read-prompt.outputs.prompt }}
          track_progress: "true"
          claude_args: |
            --model claude-sonnet-5
            --allowedTools Bash,View,WebFetch,WebSearch,Glob,Grep

  claude-mention:
    name: "Claude: Respond to mention"
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association) &&
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          gh pr view "$PR_NUMBER" --repo "$GH_REPO" \
            --json headRepository,headRefName \
            --jq '"repo=\(.headRepository.nameWithOwner)\nref=\(.headRefName)"' >> "$GITHUB_OUTPUT"

      - name: Refuse fork pull requests
        if: steps.pr.outputs.repo != github.repository
        run: |
          echo "::notice::@claude mentions are handled only for branches in this repository."
          exit 0

      - name: Checkout PR head
        if: steps.pr.outputs.repo == github.repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        if: steps.pr.outputs.repo == github.repository
        with:
          node-version-file: .node-version

      - name: Run Claude Code - Respond
        if: steps.pr.outputs.repo == github.repository
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5
            --allowedTools Bash,Read,View,Edit,Write,MultiEdit,WebFetch,WebSearch,Glob,Grep
