name: AI Review

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Maintainer PR number to review
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Review eligibility
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/elwood review') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should: ${{ steps.gate.outputs.should }}
      number: ${{ steps.gate.outputs.number }}
      head: ${{ steps.gate.outputs.head }}
      base: ${{ steps.gate.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        with:
          script: |
            const { gate } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/review/gate.mjs`);
            await gate({ github, context, core, number: process.env.PR_NUMBER });

  review:
    name: Review and publish
    needs: gate
    if: needs.gate.outputs.should == 'true'
    # Authorization precedes cancellation; this lock spans review AND publication.
    concurrency:
      group: ai-review-${{ needs.gate.outputs.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/review-run.yml
    with:
      number: ${{ needs.gate.outputs.number }}
      head: ${{ needs.gate.outputs.head }}
      base: ${{ needs.gate.outputs.base }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
