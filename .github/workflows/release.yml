name: Release

# Three ways this workflow fires:
#   1. A release PR bumps `package.json`. When it merges to `main`, the push
#      event notices the version advance, tags the merge commit, publishes to
#      npm, and creates the GitHub release. (Primary path.)
#   2. Pushing a tag `vX.Y.Z` directly skips the PR flow and ships.
#   3. `workflow_dispatch` from the Actions tab with a version input.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0 — no `v` prefix)"
        required: true
        type: string

permissions:
  contents: write # Create releases and push tags.
  id-token: write # npm trusted publishing (OIDC); no long-lived token.

jobs:
  resolve:
    # Decide whether this run releases, and at what version. For the
    # `push: main` path that means comparing package.json against the
    # previous commit: only a version that CHANGED in this push ships.
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need history and tags.
      - id: decide
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"

          if [ "$event" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$event" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_sha="${{ github.event.before }}"

          # The first push after repo creation has `before` = all zeros. Treat
          # that as "no prior state" so adding this workflow never ships
          # whatever version happened to be checked in.
          if [[ "$before_sha" == "0000000000000000000000000000000000000000" || -z "$before_sha" ]]; then
            echo "First push on main has no prior version to compare; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_version="$(node -p 'require("./package.json").version')"
          old_version="$(git show "$before_sha:package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{console.log(JSON.parse(s).version||"")}catch{console.log("")}})' || true)"

          if [ "$old_version" = "$new_version" ]; then
            echo "package.json version unchanged ($new_version); nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$new_version" ]; then
            echo "::error::could not read version from package.json"
            exit 1
          fi

          candidate_tag="v$new_version"
          if git rev-parse -q --verify "refs/tags/$candidate_tag" >/dev/null 2>&1; then
            echo "::error::version advanced to $new_version but tag $candidate_tag already exists; aborting"
            exit 1
          fi

          echo "Version advanced $old_version -> $new_version; releasing as $candidate_tag."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$candidate_tag" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Scan release source
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve publication source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare official Gitleaks image
        run: docker image inspect "$GITLEAKS_IMAGE" >/dev/null 2>&1 || docker pull "$GITLEAKS_IMAGE"
      - name: Scan publication history offline
        env:
          SCAN_HEAD: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep findings distinct from scanner-error statuses.
          readonly FINDINGS_EXIT_CODE=20
          readonly SCAN_TIMEOUT_SECONDS=300 # Leave time for checkout and image preparation.
          [[ $(git rev-parse HEAD) == "$SCAN_HEAD" ]]
          [[ $(git rev-parse --is-shallow-repository) == false ]]
          range=$SCAN_HEAD
          umask 077
          report=$(mktemp -d)
          trap 'rm -rf "$report"' EXIT
          mkdir "$report/objects"
          status=0
          docker run --rm --pull=never --network none --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_GLOBAL=/dev/null \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$report:/reports" \
            -e GIT_CONFIG_COUNT=3 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -e GIT_CONFIG_KEY_1=color.ui -e GIT_CONFIG_VALUE_1=false \
            -e GIT_CONFIG_KEY_2=color.diff -e GIT_CONFIG_VALUE_2=false \
            -e GIT_NO_REPLACE_OBJECTS=1 -e GIT_NO_LAZY_FETCH=1 \
            -e GIT_OBJECT_DIRECTORY=/reports/objects -e GIT_ALTERNATE_OBJECT_DIRECTORIES=/repo/.git/objects \
            "$GITLEAKS_IMAGE" git /repo \
            --log-opts="$range --full-history --diff-merges=remerge --text --no-ext-diff --no-textconv" \
            --redact=100 --no-banner --log-level error --timeout "$SCAN_TIMEOUT_SECONDS" --exit-code "$FINDINGS_EXIT_CODE" \
            --report-format json --report-path /reports/findings.json \
            >/dev/null 2>"$report/errors" || status=$?
          # Upstream can log a Git-source error while returning zero.
          if [[ "$status" == 125 || "$status" == 126 || "$status" == 127 ]]; then
            echo "Secret scan could not start Docker or Gitleaks (exit $status)." >&2
            exit 1
          elif [[ -s "$report/errors" || ( "$status" != 0 && "$status" != "$FINDINGS_EXIT_CODE" ) ]]; then
            category='scanner execution'
            if grep -Eiq 'config|toml|allowlist' "$report/errors"; then
              category='configuration'
            elif grep -Eiq 'permission denied|read-only file system|report|no such file' "$report/errors"; then
              category='filesystem/report'
            elif grep -Eiq 'git|repository|revision|object|fatal:' "$report/errors"; then
              category='Git history'
            fi
            echo "Secret scan error: $category (exit $status); raw diagnostics are withheld." >&2
            exit 1
          fi
          jq -c '.[] | {rule: .RuleID, line: .StartLine, commit: .Commit}' "$report/findings.json"
          count=$(jq length "$report/findings.json")
          echo "Gitleaks: $count potential finding(s). See docs/secret-scanning.md for remediation and native exceptions."
          exit "$status"

  publish:
    needs: [resolve, secret-scan]
    if: needs.resolve.outputs.should_release == 'true' && needs.secret-scan.result == 'success'
    # macOS: the full check runs the PTY-backed suite, and both adapters
    # reject other platforms at startup.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.secret-scan.outputs.commit }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify package version matches the release tag
        run: |
          set -euo pipefail
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$pkg_version" != "${{ needs.resolve.outputs.version }}" ]; then
            echo "::error::package.json version ($pkg_version) does not match release version (${{ needs.resolve.outputs.version }})"
            exit 1
          fi

      # Safety gate: never publish a build that cannot pass the full check.
      # This also produces `dist/`, which the published tarball ships.
      - name: Build, typecheck, lint, line cap, unit and conformance tests
        run: npm run check

      - name: Verify the packed tarball carries a runnable CLI
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball="$RUNNER_TEMP/with-logic-elwood-${{ needs.resolve.outputs.version }}.tgz"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install "$tarball"
          # The package declares no install scripts, so this must work with a
          # prebuilt dist straight out of the tarball (C-CLI-01).
          ./node_modules/.bin/elwood --version

      - name: Create tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.resolve.outputs.tag }}"
          git push origin "${{ needs.resolve.outputs.tag }}"

      # Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN required.
      # This relies on a trusted publisher configured at npmjs.com for
      # @with-logic/elwood pointing at this repository AND this workflow
      # filename (release.yml). Renaming this file breaks publishing until the
      # npmjs.com configuration is updated to match. Provenance is implied by
      # trusted publishing, so the flag is not passed.
      # Requires npm >= 11.5.1 and Node >= 22.14.0 (Node 24.x ships npm 11.6+).
      #
      # BOOTSTRAP: a trusted publisher can only be attached to a package that
      # already exists on the registry — npmjs.com has no page for a name that
      # has never been published, and `npm access` has no trusted-publisher
      # subcommand. So version 0.1.0 must be published once by hand from a
      # logged-in machine (`npm publish --access public`, with the
      # `@with-logic:registry` line in ~/.npmrc overridden so it targets
      # npmjs.org rather than GitHub Packages). After that first publish,
      # configure the trusted publisher at
      # npmjs.com/package/@with-logic/elwood/access and every later release
      # runs tokenlessly through this workflow.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
